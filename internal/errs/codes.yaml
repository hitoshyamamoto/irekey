    # Handling: the error-model rules "fail safe on the unknown" and
    # phase-dependent codes.
    handling: Fail safe. Before the switch, the operation aborts and the device is unchanged (exit 6). After the switch, the device is rolled back to the previous release set (exit 7); if the rollback fails, the device needs intervention (exit 8).
