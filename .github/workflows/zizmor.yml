name: zizmor

on:
  pull_request:
    branches: [main]
    paths: [".github/**"]
  push:
    branches: [main]
    paths: [".github/**"]
  workflow_dispatch:

# The repository is public and results are printed to the log instead of
# being uploaded to code scanning (advanced-security: false), so the job needs
# no token permission: checkout of a public repository and the online audits
# (which query public repositories through the GitHub API with the job token)
# work with an empty permission set.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.31.1
          # Print findings and fail the job on any of them, instead of
          # uploading SARIF (which would need security-events: write).
          advanced-security: false
